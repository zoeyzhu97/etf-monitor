name: daily-update-runner-fallback

on:
  # 主任务若因GitHub托管运行器未分配而失败，自动改用独立的macOS Intel池（避免macos-latest指向的ARM容量瓶颈）。
  workflow_run:
    workflows:
      - daily-update
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  classify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      recover: ${{ steps.classify.outputs.recover }}
    steps:
      - name: Check whether the update runner was never assigned
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('recover', 'true');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.payload.workflow_run.id, filter: 'latest'
            });
            const update = jobs.find(job => job.name === 'update');
            const recover = Boolean(update &&
              ['failure', 'cancelled', 'startup_failure', 'timed_out'].includes(update.conclusion) &&
              !update.runner_id && !(update.steps || []).some(step => step.started_at));
            core.setOutput('recover', String(recover));
            core.info(recover ? 'Update runner was not assigned; use the backup pool.' :
              'No runner allocation failure; do not repeat data collection and deployment.');

  fallback:
    needs: classify
    if: needs.classify.outputs.recover == 'true'
    uses: ./.github/workflows/daily.yml
    with:
      runner: macos-15-intel
    secrets: inherit
