name: deploy-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    # Static deployment does not require the capacity-constrained macOS ARM pool.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate official share snapshot
        run: python3 scripts/check_data_freshness.py --snapshot

      - name: Prepare static site
        run: |
          mkdir -p "${RUNNER_TEMP}/etf-monitor-pages"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            ./ "${RUNNER_TEMP}/etf-monitor-pages/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/etf-monitor-pages

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

      # Pages can still be finishing an earlier backend deployment after its job exits.
      # Retry only deployment, retaining the same validated artifact.
      - name: Allow previous Pages deployment to settle
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

      - name: Verify public Pages snapshot
        run: python3 scripts/verify_published.py --url "https://zoeyzhu97.github.io/etf-monitor/" --attempts 41
